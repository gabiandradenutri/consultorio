<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu consultório</title>
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3b1f2a;--muted:#7d5f69;--brand:#b0305a;--accent:#d45a7a;--soft:#e888a0;--blush:#f5b8c8;--brand-2:#fde8ee;--warn:#8a4b00;--bad:#b3261e;--ok:#1e7a3c;--line:#f5b8c8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit;opacity:.8}
nav button.on{background:rgba(255,255,255,.22);opacity:1;box-shadow:inset 0 -2px 0 var(--blush)}
#barra{background:var(--brand-2);padding:8px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#barra select{max-width:320px;width:auto}
main{padding:18px 20px;max-width:1240px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--brand)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
button{font:inherit}
.btn{background:var(--brand);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer}
.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.sec:hover{background:var(--brand-2)}
.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.mini{padding:3px 8px;font-size:12px;border-radius:5px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fffafb;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--brand-2);color:var(--brand);white-space:nowrap}
.tag.warn{background:#fff1e0;color:var(--warn)} .tag.bad{background:#fde8e7;color:var(--bad)} .tag.ok{background:#e4f5ea;color:var(--ok)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 150px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.aviso{background:#fff7e8;border:1px solid #f0d9a8;color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
#printArea{display:none}
.pl{color:#000;font-size:12px}
.pl h1{font-size:18px;margin:0 0 2px}
.pl h3{font-size:13px;margin:14px 0 6px;color:#000}
.pl h3 span{font-weight:400;font-size:12px}
.pl table.info td{border:0;padding:3px 8px 3px 0}
.pl table{font-size:12px}
.pl th{color:#000}
.pl .resumo td,.pl .resumo th{padding:4px 8px}
.pl .refbox{border:1px solid #9a7a85;border-radius:6px;margin-bottom:10px;break-inside:avoid;overflow:hidden}
.pl .refhead{background:#fde8ee;color:#7a1f3d;padding:6px 10px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13px}
.pl .refbox table{margin:0}
.pl .refbox td,.pl .refbox th{padding:4px 10px}
.pl .refmac{padding:4px 10px;font-size:11px;color:#444;border-top:1px solid #ddd;background:#fffafb}
.pl .txt{white-space:pre-wrap;border:1px solid #bbb;border-radius:6px;padding:8px}
.pl .assin{display:flex;justify-content:space-between;gap:40px;margin-top:44px}
.pl .rodape{font-size:10px;margin-top:18px}
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero img{height:120px;width:auto}
.hero .txt{flex:1;min-width:230px}
.hero h2{font-size:22px;margin:0 0 4px}
.big{padding:12px 18px;font-size:15px;border-radius:8px;white-space:nowrap}
.bigfull{width:100%;padding:13px;font-size:15px;border-radius:8px;text-align:center}
.home-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.home-cols{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.tile:hover{background:var(--brand-2)}
.tile b{font-size:14px;color:var(--brand)}
.tile span{font-size:12px;color:var(--muted)}
.lista-home{display:flex;flex-direction:column}
.lista-home .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.lista-home .item:first-child{border-top:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:6px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bar{width:70%;background:var(--accent);border-radius:4px 4px 0 0}
.chart .lbl{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
@media print{
  header,#barra,main,.noprint,button{display:none!important}
  body{background:#fff}
  #printArea{display:block!important}
  @page{margin:14mm}
}
</style>
</head>

/* ---------- Google Drive como armazenamento (arquivos cifrados) ---------- */
function nuvemDrive(mcp){
  const SRV = 'Google Drive', PRE = 'consultorio__', SUF = '.json';
  const tituloDe = path => PRE + path.split('/').join('__') + SUF;
  const atuais = new Map(); // título -> id do arquivo atual (o mais recente, fora da lixeira)
  const chamar = (tool, input) => mcp.callTool(SRV, tool, input, { cache: false });
  const PASTA_NOME = 'Meu consultório';
  let PASTA = null; // id da pasta "Meu consultório" no Drive
  async function pastaId(){
    if(PASTA) return PASTA;
    const r = await chamar('search_files', { query: `title = '${PASTA_NOME}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
      excludeContentSnippets: true, pageSize: 10 });
    const existente = ((r.payload || {}).files || [])[0];
    if(existente) return (PASTA = existente.id);
    const c = await chamar('create_file', { title: PASTA_NOME, contentMimeType: 'application/vnd.google-apps.folder' });
    return (PASTA = (c.payload || {}).id);
  }
  async function atualizarIndice(){
    atuais.clear(); let token;
    const pasta = await pastaId();
    do {
      const r = await chamar('search_files', Object.assign({ query: `parentId = '${pasta}' and title contains '${PRE}' and trashed = false`,
        excludeContentSnippets: true, pageSize: 100, orderBy: 'modifiedTime desc' }, token ? { pageToken: token } : {}));
      const p = r.payload || {};
      for(const f of (p.files || [])) if(!atuais.has(f.title)) atuais.set(f.title, f.id);
      token = p.nextPageToken;
    } while(token);
  }
  async function ler(id){ const r = await chamar('read_file_content', { fileId: id }); return JSON.parse((r.payload || {}).fileContent); }
  return {
    doc(path){
      const titulo = tituloDe(path);
      return {
        async get(){
          let id = atuais.get(titulo);
          if(!id){ await atualizarIndice(); id = atuais.get(titulo); }
          if(!id) return { exists:false, data: () => undefined };
          const corpo = await ler(id);
          return { exists:true, data: () => corpo };
        },
        async set(corpo){
          const antigo = atuais.get(titulo);
          const pasta = await pastaId();
          const r = await chamar('create_file', { title: titulo, parentId: pasta, textContent: JSON.stringify(corpo),
            contentMimeType: 'text/plain', disableConversionToGoogleType: true });
          const novo = (r.payload || {}).id;
          atuais.set(titulo, novo);
          if(antigo) await chamar('trash_file', { fileId: antigo });
        },
        async delete(){
          const id = atuais.get(titulo);
          if(!id) return;
          await chamar('trash_file', { fileId: id }); atuais.delete(titulo);
        }
      };
    },
    async limpar(){
      const pasta = await pastaId(); const ids = []; let token;
      do {
        const r = await chamar('search_files', Object.assign({ query: `parentId = '${pasta}' and title contains '${PRE}' and trashed = false`,
          excludeContentSnippets: true, pageSize: 100 }, token ? { pageToken: token } : {}));
        const p = r.payload || {};
        for(const f of (p.files || [])) ids.push(f.id);
        token = p.nextPageToken;
      } while(token);
      for(const id of ids) await chamar('trash_file', { fileId: id });
      atuais.clear();
    },
    collection(nome){
      const pre = PRE + nome + '__';
      return {
        async get(){
          await atualizarIndice();
          const docs = [];
          for(const [titulo, id] of atuais){
            if(!titulo.startsWith(pre) || !titulo.endsWith(SUF)) continue;
            const corpo = await ler(id);
            docs.push({ id: titulo.slice(pre.length, -SUF.length), exists:true, data: () => corpo });
          }
          return { docs };
        }
      };
    }
  };
}

/* ---------- sincronização criptografada na nuvem ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
function b64(buf){ const u = new Uint8Array(buf); let s = ''; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function hashDe(texto){ return b64(await crypto.subtle.digest('SHA-256', TE.encode(texto))); }
async function derivarChave(senha, saltB64){
  const base = await crypto.subtle.importKey('raw', TE.encode(senha), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt: unb64(saltB64), iterations: 250000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function cifrar(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, CHAVE, TE.encode(JSON.stringify(obj)));
  return { v:1, iv:b64(iv), ct:b64(ct) };
}
async function decifrar(env){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(env.iv) }, CHAVE, unb64(env.ct));
  return JSON.parse(TD.decode(pt));
}
/* cada documento da nuvem: pacientes/<id>, fotos/<id>, agenda/<id>, config/extras */
function mapaLocal(){
  const m = new Map();
  for(const p of DB.pacientes){
    const { fotos, ...resto } = p;
    m.set('pacientes/' + p.id, resto);
    for(const f of (fotos || [])) m.set('fotos/' + f.id, Object.assign({ pacienteId: p.id }, f));
  }
  m.set('agenda/todos', { itens: agList() });
  m.set('config/extras', { extras: DB.extras || [] });
  return m;
}
async function hashesDe(m){ const h = {}; for(const [k, v] of m) h[k] = await hashDe(JSON.stringify(v)); return h; }
function gravarSync(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(ULTIMO)); } catch(e){} }
function gravarLocal(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }
function msgErro(e){
  const c = e && e.code;
  if(c === 'needs_reauth') return 'conexão com o Google Drive expirou; reconecte em Configurações > Conectores';
  if(c === 'server_not_connected') return 'Google Drive não conectado em Configurações > Conectores';
  if(c === 'approval_required') return 'aprove o acesso ao Google Drive para sincronizar';
  if(c === 'blocked_by_policy' || c === 'not_in_manifest') return 'o acesso ao Google Drive não é permitido para esta conta';
  if(c === 'not_granted' || c === 'capability_disabled') return 'sincronização indisponível nesta visualização';
  return 'sem conexão com o Google Drive; nova tentativa em instantes';
}
function setSync(estado, msg){
  const el = document.getElementById('sync'); if(!el) return;
  if(estado === 'bloqueado'){
    el.innerHTML = `<span>Senha de sincronização:</span> <input type="password" id="syncSenha" style="width:160px;padding:4px 6px">
      <button class="btn mini" onclick="desbloquear()">Entrar</button>
      <button class="btn mini sec" onclick="setSync('redefinir')">Esqueci a senha</button>${msg ? ` <span style="color:var(--bad)">${esc(msg)}</span>` : ''}`;
    return;
  }
  if(estado === 'conectar'){
    el.innerHTML = `<button class="btn mini" onclick="conectarGoogle()">Conectar ao Google Drive</button>${msg ? ` <span style="color:var(--bad)">${esc(msg)}</span>` : ''}`;
    return;
  }
  if(estado === 'redefinir'){
    el.innerHTML = `<span>Nova senha (mín. 8):</span> <input type="password" id="novaSenha" style="width:130px;padding:4px 6px">
      <input type="password" id="novaSenha2" placeholder="repita" style="width:130px;padding:4px 6px">
      <button class="btn mini" onclick="redefinirSenha()">Redefinir</button>
      <button class="btn mini sec" onclick="setSync('bloqueado')">Cancelar</button>
      <div class="muted" style="font-size:11px;max-width:560px">Isso apaga a cópia cifrada da nuvem e envia os dados deste navegador com a senha nova. Dados que existem só em outro aparelho não serão trazidos.</div>${msg ? ` <span style="color:var(--bad)">${esc(msg)}</span>` : ''}`;
    return;
  }
  el.textContent = {
    local: 'Modo local: dados só neste navegador',
    conectando: 'Conectando à nuvem…',
    sinc: 'Sincronizando…',
    ok: '● Sincronizado na nuvem (criptografado)',
    aviso: '● Sincronizado; ' + FALHAS.length + ' foto(s) grande(s) demais ficaram só neste navegador',
    erro: '● ' + (msg || 'erro de sincronização')
  }[estado] || '';
}
async function lerNuvem(){
  const [pacs, fots, cfg, ag] = await Promise.all([
    NUVEM.collection('pacientes').get(), NUVEM.collection('fotos').get(),
    NUVEM.doc('config/extras').get(), NUVEM.doc('agenda/todos').get() ]);
  const abrir = async snap => { const out = []; for(const d of snap.docs){ if(d.exists) out.push(await decifrar(d.data())); } return out; };
  const pacientes = await abrir(pacs), fotos = await abrir(fots);
  const agenda = ag.exists ? ((await decifrar(ag.data())).itens || []) : [];
  const extras = cfg.exists ? ((await decifrar(cfg.data())).extras || []) : [];
  for(const p of pacientes) p.fotos = fotos.filter(f => f.pacienteId === p.id).map(({ pacienteId, ...f }) => f);
  return { pacientes, agenda, extras };
}
async function enviarMudancas(){
  const m = mapaLocal();
  for(const k of Object.keys(ULTIMO)){
    if(m.has(k)) continue;
    await NUVEM.doc(k).delete(); delete ULTIMO[k]; gravarSync();
  }
  for(const [k, v] of m){
    const h = await hashDe(JSON.stringify(v));
    if(ULTIMO[k] === h) continue;
    try { await NUVEM.doc(k).set(await cifrar(v)); }
    catch(e){ if(e && e.code === 'bad_request') FALHAS.push(k); else throw e; }
    ULTIMO[k] = h; gravarSync();
  }
}
async function primeiraSincronizacao(){
  // neste aparelho ainda não houve sincronização: une o que está na nuvem com o que está aqui (o local prevalece em caso de mesmo id)
  const nuvem = await lerNuvem();
  const ids = new Set(DB.pacientes.map(p => p.id));
  for(const p of nuvem.pacientes){
    if(!ids.has(p.id)){ DB.pacientes.push(p); continue; }
    const loc = DB.pacientes.find(x => x.id === p.id);
    const fi = new Set((loc.fotos || []).map(f => f.id));
    loc.fotos = (loc.fotos || []).concat((p.fotos || []).filter(f => !fi.has(f.id)));
  }
  const aids = new Set(agList().map(a => a.id));
  DB.agenda = agList().concat(nuvem.agenda.filter(a => !aids.has(a.id)));
  if(!(DB.extras || []).length) DB.extras = nuvem.extras;
  gravarLocal();
  ULTIMO = {}; gravarSync();
  await enviarMudancas();
}
async function sincronizar(puxar){
  if(!NUVEM || !CHAVE) return;
  if(SINC_RODANDO){ SINC_PENDENTE = true; SINC_PUXAR = SINC_PUXAR || !!puxar; return; }
  SINC_RODANDO = true; FALHAS = [];
  let mudouDoNuvem = false;
  try {
    setSync('sinc');
    if(ULTIMO === null){ await primeiraSincronizacao(); mudouDoNuvem = true; }
    else {
      await enviarMudancas();
      if(puxar){
        const nuvem = await lerNuvem();
        DB.pacientes = nuvem.pacientes; DB.agenda = nuvem.agenda; DB.extras = nuvem.extras;
        gravarLocal(); mudouDoNuvem = true;
        ULTIMO = await hashesDe(mapaLocal()); gravarSync();
      }
    }
    setSync(FALHAS.length ? 'aviso' : 'ok');
    if(mudouDoNuvem) render();
  } catch(e){
    setSync('erro', msgErro(e));
    clearTimeout(SINC_TIMER); SINC_TIMER = setTimeout(() => sincronizar(false), 20000);
  } finally {
    SINC_RODANDO = false;
    if(SINC_PENDENTE){ const p = SINC_PUXAR; SINC_PENDENTE = false; SINC_PUXAR = false; sincronizar(p); }
  }
}
async function redefinirSenha(){
  const a = document.getElementById('novaSenha'), b = document.getElementById('novaSenha2');
  const s1 = a ? a.value : '', s2 = b ? b.value : '';
  if(s1.length < 8){ setSync('redefinir', 'use pelo menos 8 caracteres'); return; }
  if(s1 !== s2){ setSync('redefinir', 'as senhas não coincidem'); return; }
  if(!NUVEM){ setSync('erro', 'sem conexão com o Google Drive'); return; }
  setSync('sinc');
  try {
    await NUVEM.limpar();
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    CHAVE = await derivarChave(s1, salt);
    await NUVEM.doc('config/seguranca').set({ salt, verificador: await cifrar({ ok:true }) });
  } catch(e){ CHAVE = null; setSync('erro', msgErro(e)); return; }
  ULTIMO = {}; gravarSync();
  await sincronizar(false);
}
async function desbloquear(){
  const el = document.getElementById('syncSenha');
  const senha = el ? el.value : '';
  if(senha.length < 8){ setSync('bloqueado', 'use pelo menos 8 caracteres'); return; }
  setSync('sinc');
  try {
    const cfg = await NUVEM.doc('config/seguranca').get();
    const salt = cfg.exists ? cfg.data().salt : b64(crypto.getRandomValues(new Uint8Array(16)));
    CHAVE = await derivarChave(senha, salt);
    if(cfg.exists){
      try { await decifrar(cfg.data().verificador); }
      catch(e){ CHAVE = null; setSync('bloqueado', 'senha incorreta'); return; }
    } else {
      await NUVEM.doc('config/seguranca').set({ salt, verificador: await cifrar({ ok:true }) });
    }
  } catch(e){ CHAVE = null; setSync('erro', msgErro(e)); return; }
  await sincronizar(true);
}
/* ---------- conexão direta com o Google (quando o app roda fora do claude.ai) ---------- */
const GOOGLE_CLIENT_ID = '571512347322-3gq476qd61c8fdflkhilsv6hres2g8gu.apps.googleusercontent.com';
let TOKEN = null, TOKEN_EXPIRA = 0;
const erroCom = (code, msg, retryable) => Object.assign(new Error(msg), { code, retryable: !!retryable });
function carregarGoogle(){
  return new Promise((ok, falha) => {
    if(window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => ok();
    s.onerror = () => falha(erroCom('server_unavailable', 'não foi possível carregar o login do Google', true));
    document.head.appendChild(s);
  });
}
function pedirToken(prompt){
  return new Promise((ok, falha) => {
    const cliente = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
      callback: r => {
        if(r.error){ falha(erroCom('needs_reauth', 'é preciso entrar com o Google de novo')); return; }
        TOKEN = r.access_token; TOKEN_EXPIRA = Date.now() + (Number(r.expires_in) - 60) * 1000; ok();
      },
      error_callback: () => falha(erroCom('needs_reauth', 'é preciso entrar com o Google de novo'))
    });
    cliente.requestAccessToken({ prompt });
  });
}
async function api(url, opts){
  opts = opts || {};
  if(!TOKEN || Date.now() > TOKEN_EXPIRA) await pedirToken('');
  const headers = Object.assign({ Authorization: 'Bearer ' + TOKEN }, opts.headers || {});
  const r = await fetch(url, Object.assign({}, opts, { headers }));
  if(r.status === 401){ TOKEN = null; throw erroCom('needs_reauth', 'é preciso entrar com o Google de novo'); }
  if(!r.ok){ throw erroCom(r.status >= 500 ? 'server_unavailable' : 'bad_request', 'Drive respondeu ' + r.status, r.status >= 500); }
  return r;
}
// Mesma interface de ferramentas que o conector do claude.ai, falando direto com a API do Drive
function mcpDireto(){
  const API = 'https://www.googleapis.com/drive/v3/files';
  return {
    listTools: async () => ({ servers: [{ server: 'Google Drive', authStatus: 'connected', tools: [] }] }),
    callTool: async (server, tool, input) => {
      if(tool === 'search_files'){
        const pai = /parentId = '([^']*)'/.exec(input.query);
        const pre = /title contains '([^']*)'/.exec(input.query);
        const mime = /mimeType = '([^']*)'/.exec(input.query);
        const titulo = /title = '([^']*)'/.exec(input.query);
        let q = 'trashed = false';
        if(pai) q += ` and '${pai[1]}' in parents`;
        if(mime) q += ` and mimeType = '${mime[1]}'`;
        if(titulo) q += ` and name = '${titulo[1].replace(/\\/g,'\\\\').replace(/'/g,"\\'")}'`;
        const params = new URLSearchParams({ q, fields: 'nextPageToken,files(id,name,modifiedTime)', pageSize: String(input.pageSize || 100), spaces: 'drive' });
        if(input.pageToken) params.set('pageToken', input.pageToken);
        const j = await (await api(API + '?' + params)).json();
        const files = (j.files || []).filter(f => !pre || f.name.startsWith(pre[1]))
          .map(f => ({ id: f.id, title: f.name, modifiedTime: f.modifiedTime }));
        return { payload: { files, nextPageToken: j.nextPageToken } };
      }
      if(tool === 'read_file_content'){
        const txt = await (await api(API + '/' + encodeURIComponent(input.fileId) + '?alt=media')).text();
        return { payload: { fileContent: txt } };
      }
      if(tool === 'create_file'){
        const meta = { name: input.title };
        if(input.parentId) meta.parents = [input.parentId];
        if(input.contentMimeType === 'application/vnd.google-apps.folder'){
          meta.mimeType = 'application/vnd.google-apps.folder';
          const j = await (await api(API + '?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) })).json();
          return { payload: { id: j.id } };
        }
        meta.mimeType = 'text/plain';
        const b = 'b' + Math.random().toString(36).slice(2) + Date.now();
        const corpo = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n${input.textContent}\r\n--${b}--`;
        const j = await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
          method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: corpo })).json();
        return { payload: { id: j.id } };
      }
      if(tool === 'trash_file'){
        await api(API + '/' + encodeURIComponent(input.fileId), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) });
        return { payload: {} };
      }
      throw erroCom('bad_request', 'ferramenta desconhecida: ' + tool);
    }
  };
}
async function conectarGoogle(){
  setSync('conectando');
  try { await carregarGoogle(); await pedirToken('consent'); }
  catch(e){ setSync('erro', msgErro(e)); return; }
  NUVEM = nuvemDrive(mcpDireto());
  setSync('bloqueado');
}

async function iniciarSync(){
  try { ULTIMO = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch(e){ ULTIMO = null; }
  setSync('conectando');
  try {
    const mcp = (window.claude && window.claude.use) ? await window.claude.use('mcp') : null;
    if(!mcp){
      if(GOOGLE_CLIENT_ID.indexOf('__') === 0){ setSync('local'); return; }
      setSync('conectar'); return;
    }
    const info = await mcp.listTools('Google Drive');
    const srv = (info.servers || []).find(x => x.server === 'Google Drive');
    if(!srv || srv.authStatus === 'needs_reauth'){ setSync('erro', msgErro({ code: srv ? 'needs_reauth' : 'server_not_connected' })); return; }
    NUVEM = nuvemDrive(mcp);
  } catch(e){ NUVEM = null; setSync('erro', msgErro(e)); return; }
  if(!(window.crypto && crypto.subtle)){ NUVEM = null; setSync('erro', 'este navegador não tem criptografia; use o modo local'); return; }
  setSync('bloqueado');
}

/* ---------- base de alimentos ---------- */
function montarAlimentos(){
  const base = TACO.map(a => ({ key:'TACO:'+a.id, src:'TACO', cod:String(a.id), nome:a.nome, k:a.kcal, p:a.proteina, l:a.lipideos, c:a.carboidrato, f:a.fibra, col:a.colesterol, ca:a.calcio, mg:a.magnesio }));
  ALIM = base.concat(DB.extras);
  MAPA = new Map(ALIM.map(a => [a.key, a]));
  ROTULO = new Map(ALIM.map(a => [rotulo(a), a.key]));
  document.getElementById('dl-alim').innerHTML = ALIM.map(a => `<option value="${esc(rotulo(a))}"></option>`).join('');
}
function nutrientes(key, qtd){
  const a = MAPA.get(key); if(!a) return null;
  const f = (qtd || 0) / 100;
  const g = x => (x == null ? 0 : x * f);
  return { k:g(a.k), p:g(a.p), l:g(a.l), c:g(a.c), f:g(a.f), col:g(a.col), ca:g(a.ca), mg:g(a.mg) };
}
function somar(refeicoes){
  const t = {k:0,p:0,l:0,c:0,f:0,col:0,ca:0,mg:0};
  refeicoes.forEach(r => r.itens.forEach(it => { const n = nutrientes(it.key, it.qtd); if(n) Object.keys(t).forEach(k => t[k] += n[k]); }));
  return t;
}

/* ---------- pacientes ---------- */
function pac(){ return DB.pacientes.find(p => p.id === DB.ativo) || null; }
function semPaciente(){ return '<div class="card empty">Cadastre ou selecione um paciente na aba <b>Pacientes</b> para usar esta seção.</div>'; }
function ultimaAntro(p){ const l = ((p && p.antro) || []).slice().sort((a,b) => a.data < b.data ? 1 : -1); return l[0] || null; }
function idadeEm(nasc, data){
  if(!nasc) return null;
  const n = new Date(nasc + 'T00:00'), d = new Date((data || hoje()) + 'T00:00');
  let a = d.getFullYear() - n.getFullYear();
  const m = d.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && d.getDate() < n.getDate())) a--;
  return a;
}
const ESTADO_CIVIL = ['Solteiro(a)','Casado(a) / união estável','Divorciado(a)','Viúvo(a)','Não informado'];
function formPaciente(p, pre){
  p = p || {};
  const H = txt => `<h3 style="font-size:13px;color:var(--brand);margin:14px 0 8px">${txt}</h3>`;
  const i = (id, label, val, tipo, full) => `<label${full ? ' style="grid-column:1/-1"' : ''}>${label}<input ${tipo ? `type="${tipo}"` : ''} id="${pre}${id}" value="${esc(val || '')}"></label>`;
  const t = (id, label, val) => `<label>${label}<textarea id="${pre}${id}">${esc(val || '')}</textarea></label>`;
  const s = (id, label, opts, val) => `<label>${label}<select id="${pre}${id}">${opts.map(o => `<option value="${esc(o[0])}" ${o[0] === val ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  return `${H('Identificação')}
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
    ${i('Nome','Nome completo',p.nome,'',true)}
    ${s('Sexo','Sexo',[['F','Feminino'],['M','Masculino']], p.sexo === 'M' ? 'M' : 'F')}
    ${i('Nasc','Data de nascimento',p.nasc,'date')}
    ${i('CPF','CPF (opcional)',p.cpf)}
    ${s('EstCiv','Estado civil',ESTADO_CIVIL.map(x => [x,x]), p.estCiv)}
    ${i('Prof','Profissão',p.prof)}
  </div>
  ${H('Contato e endereço')}
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
    ${i('Tel','Telefone / WhatsApp',p.tel)}
    ${i('Email','E-mail',p.email,'email')}
    ${i('End','Endereço completo',p.endereco,'',true)}
    ${i('EmergNome','Contato de emergência (nome)',p.emergNome)}
    ${i('EmergTel','Contato de emergência (telefone)',p.emergTel)}
  </div>
  ${H('Atendimento')}
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
    ${i('Conv','Convênio / plano',p.convenio)}
    ${i('Enc','Encaminhado por',p.encaminhadoPor)}
  </div>
  ${H('Objetivo do tratamento')}
  ${t('Objetivo','Objetivo principal (ex.: emagrecimento, ganho de massa magra, controle glicêmico)',p.objetivo)}
  <label style="margin-top:10px">Observações gerais<textarea id="${pre}Obs">${esc(p.obs || '')}</textarea></label>`;
}
function lerPaciente(pre){
  const g = id => v(pre + id);
  return { nome:g('Nome'), sexo:g('Sexo'), nasc:g('Nasc'), cpf:g('CPF'), estCiv:g('EstCiv'), prof:g('Prof'),
    tel:g('Tel'), email:g('Email'), endereco:g('End'), emergNome:g('EmergNome'), emergTel:g('EmergTel'),
    convenio:g('Conv'), encaminhadoPor:g('Enc'), objetivo:g('Objetivo'), obs:g('Obs') };
}
function novoPaciente(){
  const d = lerPaciente('np');
  if(!d.nome){ alert('Informe o nome do paciente.'); return; }
  const p = Object.assign({ id:uid(), antro:[], evol:[], presc:[], ficha:{} }, d);
  DB.pacientes.push(p); DB.ativo = p.id; PRESC_ID = null; salvar(); TAB = 'antropometria'; render();
}
function salvarPaciente(id){
  const p = DB.pacientes.find(x => x.id === id), d = lerPaciente('ed');
  if(!d.nome){ alert('O nome não pode ficar vazio.'); return; }
  Object.assign(p, d); salvar(); render();
}
function ativar(id){ DB.ativo = id; PRESC_ID = null; salvar(); render(); }
function excluirPaciente(id){
  const p = DB.pacientes.find(x => x.id === id);
  if(!confirm(`Excluir ${p.nome} e todo o histórico (avaliações, prontuário e prescrições)? Não pode ser desfeito.`)) return;
  DB.pacientes = DB.pacientes.filter(x => x.id !== id);
  DB.agenda = (DB.agenda || []).filter(a => a.pacienteId !== id);
  if(DB.ativo === id) DB.ativo = null;
  salvar(); render();
}

    ${lista.map(x => `<tr><td><b>${esc(x.nome)}</b>${x.id===DB.ativo?' <span class="tag">ativo</span>':''}</td><td>${x.sexo==='M'?'Masculino':'Feminino'}</td><td>${idadeEm(x.nasc) ?? '—'}</td><td>${esc(x.tel||'')}</td><td class="num">${(x.antro||[]).length}</td><td class="num">${(x.presc||[]).length}</td><td style="white-space:nowrap"><button class="btn sec mini" onclick="ativar('${x.id}')">Ativar</button> <button class="btn danger mini" onclick="excluirPaciente('${x.id}')">Excluir</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Nenhum paciente cadastrado ainda.</div>'}
  </div>`;
}

/* ---------- antropometria: 7 dobras (Jackson & Pollock) + Siri ---------- */
function classeIMC(imc, idade){
  if(imc == null) return ['—',''];
  if(idade != null && idade >= 60){
    if(imc < 22) return ['Baixo peso (idoso)','bad'];
    if(imc < 27) return ['Eutrofia (idoso)','ok'];
    if(imc < 30) return ['Sobrepeso (idoso)','warn'];
    return ['Obesidade (idoso)','bad'];
  }
  if(imc < 18.5) return ['Baixo peso','bad'];
  if(imc < 25) return ['Eutrofia','ok'];
  if(imc < 30) return ['Sobrepeso','warn'];
  if(imc < 35) return ['Obesidade grau I','bad'];
  if(imc < 40) return ['Obesidade grau II','bad'];
  return ['Obesidade grau III','bad'];
}
function densidadeJP7(d, idade, hom){
  const s = DOBRAS.reduce((acc,[k]) => acc + d[k], 0);
  const db = hom
    ? 1.112 - 0.00043499*s + 0.00000055*s*s - 0.00028826*idade
    : 1.097 - 0.00046971*s + 0.00000056*s*s - 0.00012828*idade;
  return { soma:s, db };
}
function calcAntro(a, p){
  const alt = a.altura / 100, imc = a.peso / (alt*alt);
  const idade = idadeEm(p.nasc, a.data), hom = p.sexo === 'M';
  const [cls, cor] = classeIMC(imc, idade);
  const rcq = (a.cintura != null && a.quadril) ? a.cintura / a.quadril : null;
  const rcqCls = rcq == null ? '—' : ((hom ? rcq > 0.90 : rcq > 0.85) ? 'Risco aumentado' : 'Adequado');
  let cintCls = '—';
  if(a.cintura != null){ const lim = hom ? [94,102] : [80,88]; cintCls = a.cintura >= lim[1] ? 'Risco muito aumentado' : a.cintura >= lim[0] ? 'Risco aumentado' : 'Adequado'; }
  const d = a.dobras || {};
  const completas = DOBRAS.every(([k]) => d[k] != null);
  let jp = null, gc = null, mg = null, mm = null, aviso = '';
  if(!completas) aviso = 'Dobras incompletas';
  else if(idade == null) aviso = 'Data de nascimento necessária';
  else if(idade < 18 || idade > 61) aviso = 'Protocolo validado para 18 a 61 anos';
  if(completas && idade != null){
    jp = densidadeJP7(d, idade, hom);
    gc = (4.95 / jp.db - 4.50) * 100;
    mg = a.peso * gc / 100;
    mm = a.peso - mg;
  }
  return { imc, cls, cor, idade, rcq, rcqCls, cintCls, pesoIdeal:22*alt*alt, jp, gc, mg, mm, aviso };
}
function novaAntro(){
  const p = pac(), peso = num(v('aPeso')), altura = num(v('aAlt'));
  if(!peso || !altura){ alert('Informe peso e altura.'); return; }
  const dobras = {};
  DOBRAS.forEach(([k]) => dobras[k] = num(v('dob_' + k)));
  p.antro = (p.antro || []).concat([{
    id:uid(), data:v('aData') || hoje(), peso, altura,
    cintura:num(v('aCint')), quadril:num(v('aQuad')), braco:num(v('aBraco')), panturrilha:num(v('aPant')),
    dobras, obs:v('aObs')
  }]);
  salvar(); render();
}
function excluirAntro(id){ if(!confirm('Excluir esta avaliação?')) return; const p = pac(); p.antro = p.antro.filter(a => a.id !== id); salvar(); render(); }
function rAntro(){
  const el = document.getElementById('tab-antropometria'), p = pac();
  if(!p){ el.innerHTML = semPaciente(); return; }
  const lista = (p.antro || []).slice().sort((a,b) => a.data < b.data ? 1 : -1);
  const ult = lista[0], primeira = lista[lista.length - 1];
  const c = ult ? calcAntro(ult, p) : null;
  const tagCls = s => s === 'Adequado' ? 'ok' : (s === '—' ? '' : 'bad');
  const kpi = c ? `<div class="card"><h2>Situação atual · ${fmtData(ult.data)}</h2>
    ${c.aviso ? `<div class="aviso">${esc(c.aviso)}: ${c.aviso.startsWith('Dobras') ? 'o %G e a composição corporal não são calculados.' : 'verifique a validade do protocolo.'}</div>` : ''}
    <div class="kpis">
     <div class="kpi"><span>IMC (kg/m²)</span><b>${fmt(c.imc)}</b><span class="tag ${c.cor}">${c.cls}</span></div>
     <div class="kpi"><span>Gordura corporal (Siri)</span><b>${c.gc == null ? '—' : fmt(c.gc)+'%'}</b><span>Σ7 dobras: ${c.jp ? fmt(c.jp.soma,0)+' mm' : '—'}</span></div>
     <div class="kpi"><span>Massa gorda</span><b>${c.mg == null ? '—' : fmt(c.mg)+' kg'}</b></div>
     <div class="kpi"><span>Massa magra</span><b>${c.mm == null ? '—' : fmt(c.mm)+' kg'}</b></div>
     <div class="kpi"><span>Peso atual / ideal (IMC 22)</span><b>${fmt(ult.peso)} kg</b><span>ideal: ${fmt(c.pesoIdeal)} kg</span></div>
     <div class="kpi"><span>Cintura · RCQ</span><b>${ult.cintura == null ? '—' : fmt(ult.cintura,0)+' cm'}</b><span class="tag ${tagCls(c.cintCls)}">${c.cintCls}</span><span class="tag ${tagCls(c.rcqCls)}">RCQ ${fmt(c.rcq,2)}</span></div>
    </div></div>` : '';
  const dobraInputs = DOBRAS.map(([k,l]) => `<label>${l} (mm)<input id="dob_${k}" inputmode="decimal"></label>`).join('');
  el.innerHTML = `${kpi}
  <div class="card"><h2>Nova avaliação · ${esc(p.nome)}</h2>
    <div class="grid">
      <label>Data<input type="date" id="aData" value="${hoje()}"></label>
      <label>Peso (kg)<input id="aPeso" inputmode="decimal"></label>
      <label>Altura (cm)<input id="aAlt" inputmode="decimal" value="${ult ? ult.altura : ''}"></label>
      <label>Cintura (cm)<input id="aCint" inputmode="decimal"></label>
      <label>Quadril (cm)<input id="aQuad" inputmode="decimal"></label>
      <label>Braço (cm)<input id="aBraco" inputmode="decimal"></label>
      <label>Panturrilha (cm)<input id="aPant" inputmode="decimal"></label>
    </div>
    <h3 style="font-size:13px;color:var(--brand);margin:16px 0 8px">Dobras cutâneas · protocolo de 7 dobras (Jackson &amp; Pollock)</h3>
    <div class="grid">${dobraInputs}</div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">Locais: peitoral (diagonal), axilar média, tríceps, subescapular (diagonal), abdominal (2 cm à direita da cicatriz umbilical), suprailíaca (diagonal) e coxa (ponto médio). Use compasso calibrado e registre a média de duas medidas por local.</p>
    <label style="margin-top:12px">Observações<textarea id="aObs"></textarea></label>
    <div style="margin-top:10px"><button class="btn" onclick="novaAntro()">Registrar avaliação</button></div>
  </div>
  <div class="card"><h2>Histórico</h2>
  ${lista.length ? `<div style="overflow-x:auto"><table><thead><tr>
     <th>Data</th><th class="num">Idade</th><th class="num">Peso (kg)</th><th class="num">IMC</th><th>Classificação IMC</th>
     <th class="num">Σ7 dobras (mm)</th><th class="num">%G</th><th class="num">Massa gorda (kg)</th><th class="num">Massa magra (kg)</th>
     <th class="num">Cintura (cm)</th><th class="num">RCQ</th><th class="num">Variação peso</th><th></th></tr></thead><tbody>
     ${lista.map(a => { const x = calcAntro(a, p); const va = (a !== primeira && primeira.peso) ? (a.peso - primeira.peso) / primeira.peso * 100 : null;
       return `<tr><td>${fmtData(a.data)}</td><td class="num">${x.idade ?? '—'}</td><td class="num">${fmt(a.peso)}</td><td class="num">${fmt(x.imc)}</td><td><span class="tag ${x.cor}">${x.cls}</span></td>
       <td class="num">${x.jp ? fmt(x.jp.soma,0) : '—'}</td><td class="num">${x.gc == null ? '—' : fmt(x.gc)}</td><td class="num">${fmt(x.mg)}</td><td class="num">${fmt(x.mm)}</td>
       <td class="num">${fmt(a.cintura,0)}</td><td class="num">${fmt(x.rcq,2)}</td><td class="num">${va == null ? '—' : (va>0?'+':'') + fmt(va) + '%'}</td>
       <td><button class="btn danger mini" onclick="excluirAntro('${a.id}')">×</button></td></tr>`; }).join('')}
     </tbody></table></div>
     <p class="muted" style="font-size:12px;margin-top:8px">%G: equação de Jackson &amp; Pollock (7 dobras, 1978) com densidade convertida por Siri (1961). Classificação do IMC: OMS (adultos) e critérios OPAS/Lipschitz para ≥60 anos. Cintura e RCQ: OMS. Variação em relação à primeira avaliação.</p>`
     : '<div class="empty">Nenhuma avaliação registrada.</div>'}
  </div>`;
}

/* ---------- prontuário ---------- */
const TIPOS_CONSULTA = ['Primeira consulta','Retorno','Reavaliação','Teleconsulta'];
function salvarFicha(){
  const p = pac();
  p.ficha = { queixa:v('fQueixa'), hist:v('fHist'), med:v('fMed'), alerg:v('fAlerg'), hab:v('fHab'), ativ:v('fAtiv'), exam:v('fExam') };
  salvar();
  document.getElementById('fSalvo').textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function novaEvol(){
  const p = pac(), texto = v('eTexto'), diag = v('eDiag'), objetivo = v('eObjetivo');
  if(!texto && !diag && !objetivo){ alert('Preencha ao menos o objetivo, o diagnóstico ou a evolução.'); return; }
  p.evol = (p.evol || []).concat([{ id:uid(), data:v('eData') || hoje(), tipo:v('eTipo'), objetivo, diag, texto }]);
  salvar(); render();
}
function excluirEvol(id){ if(!confirm('Excluir este registro?')) return; const p = pac(); p.evol = p.evol.filter(e => e.id !== id); salvar(); render(); }
function rPront(){
  const el = document.getElementById('tab-prontuario'), p = pac();
  if(!p){ el.innerHTML = semPaciente(); return; }
  const f = p.ficha || {};
  const ta = (id, label, val) => `<label>${label}<textarea id="${id}">${esc(val || '')}</textarea></label>`;
  const evol = (p.evol || []).slice().sort((a,b) => a.data < b.data ? 1 : -1);
  el.innerHTML = `
  <div class="card"><h2>Ficha clínica · ${esc(p.nome)}</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      ${ta('fQueixa','Queixa principal', f.queixa)}
      ${ta('fHist','História clínica e doenças prévias', f.hist)}
      ${ta('fMed','Medicamentos em uso', f.med)}
      ${ta('fAlerg','Alergias e intolerâncias alimentares', f.alerg)}
      ${ta('fHab','Hábitos alimentares e rotina de refeições', f.hab)}
      ${ta('fAtiv','Atividade física, sono, tabagismo e etilismo', f.ativ)}
      ${ta('fExam','Resumo de exames (detalhes na aba Exames)', f.exam)}
    </div>
    <div style="margin-top:10px"><button class="btn" onclick="salvarFicha()">Salvar ficha</button> <span class="muted" id="fSalvo"></span></div>
  </div>
  <div class="card"><h2>Consultas e evoluções</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <label>Data<input type="date" id="eData" value="${hoje()}"></label>

    </div>
    <label style="margin-top:10px">Diagnóstico nutricional (formato PES)<input id="eDiag" placeholder="Problema relacionado a etiologia, evidenciado por sinais/sintomas"></label>
    <label style="margin-top:10px">Evolução e conduta<textarea id="eTexto"></textarea></label>
    <div style="margin-top:10px"><button class="btn" onclick="novaEvol()">Registrar consulta</button></div>
    <div style="margin-top:16px">${evol.length ? evol.map(e => `<div style="border-top:1px solid var(--line);padding:10px 0">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${fmtData(e.data)}</b>${e.tipo ? `<span class="tag">${esc(e.tipo)}</span>` : ''}${e.diag ? `<span class="tag warn">${esc(e.diag)}</span>` : ''}

/* ---------- início (meu consultório) ---------- */
function irPara(aba, depois){
  TAB = aba; PRESC_ID = null; render();
  if(depois) setTimeout(depois, 0);
}
function focar(id){ return () => { const el = document.getElementById(id); if(el) el.focus(); }; }

  if(!pac()){ alert('Selecione ou cadastre um paciente para registrar a consulta.'); irPara('pacientes'); return; }
  irPara('prontuario', focar('eObjetivo'));
}

function abrirPacienteHome(id){ DB.ativo = id; PRESC_ID = null; salvar(); irPara('prontuario'); }
function rInicio(){
  const el = document.getElementById('tab-inicio');
  const hj = hoje(), ini = segundaDe(hj), fim = dataSomar(ini, 6);
  const pacs = DB.pacientes.slice().sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  const agHoje = agList().filter(a => a.data === hj && a.status !== 'Cancelado').sort((a,b) => a.hora < b.hora ? -1 : 1);
  const agSemana = agList().filter(a => a.data >= ini && a.data <= fim && a.status !== 'Cancelado').length;
  const consultas = pacs.reduce((s,p) => s + (p.evol || []).length, 0);
  const prescricoes = pacs.reduce((s,p) => s + (p.presc || []).length, 0);
  const mesAtual = hj.slice(5,7);
  const aniversariantes = pacs.filter(p => p.nasc && p.nasc.slice(5,7) === mesAtual)
    .sort((a,b) => a.nasc.slice(8,10) < b.nasc.slice(8,10) ? -1 : 1);
  // consultas registradas por mês (últimos 12 meses)
  const meses = [];
  for(let i = 11; i >= 0; i--){ const d = new Date(hj + 'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth() - i); meses.push(d.toISOString().slice(0,7)); }
  const cont = meses.map(m => pacs.reduce((s,p) => s + (p.evol || []).filter(e => (e.data || '').slice(0,7) === m).length, 0));

/* ---------- agenda de consultas ---------- */
const STATUS_AG = ['Agendado','Confirmado','Realizado','Faltou','Cancelado'];
const DURACOES = [30,45,60,90,120];
const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
let AG_INICIO = null; // segunda-feira da semana exibida (AAAA-MM-DD)

function agList(){ if(!DB.agenda) DB.agenda = []; return DB.agenda; }
function dataSomar(iso, dias){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + dias); return d.toISOString().slice(0,10); }
function diaSemana(iso){ return new Date(iso + 'T12:00:00').getDay(); }
function segundaDe(iso){ const w = diaSemana(iso); return dataSomar(iso, w === 0 ? -6 : 1 - w); }
function minDe(h){ const [a,b] = String(h).split(':').map(Number); return a*60 + b; }
function pacienteDe(id){ return DB.pacientes.find(x => x.id === id) || null; }
function conflitos(data, hora, duracao, ignorarId){
  const ini = minDe(hora), fim = ini + duracao;
  return agList().filter(a => a.id !== ignorarId && a.data === data && a.hora
    && a.status !== 'Cancelado' && a.status !== 'Faltou'
    && ini < minDe(a.hora) + (a.duracao || 30) && minDe(a.hora) < fim);
}
function opcoesPacientes(sel){
  return '<option value="">— selecione —</option>' + DB.pacientes.slice().sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'))
    .map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
}
function novoAgendamento(){
  const pid = v('agPac'), data = v('agData'), hora = v('agHora'), dur = parseInt(v('agDur'), 10) || 60, tipo = v('agTipo'), obs = v('agObs');
  if(!pid){ alert('Selecione o paciente.'); return; }
  if(!data || !hora){ alert('Informe a data e o horário.'); return; }
  const c = conflitos(data, hora, dur, null);
  if(c.length && !confirm('Há conflito com: ' + c.map(a => a.hora + ' ' + (pacienteDe(a.pacienteId)?.nome || '(excluído)')).join('; ') + '. Agendar mesmo assim?')) return;
  agList().push({ id:uid(), data, hora, duracao:dur, pacienteId:pid, tipo, status:'Agendado', obs });
  salvar(); AG_INICIO = segundaDe(data); render();
}
function mudarStatus(id, st){ const a = agList().find(x => x.id === id); if(!a) return; a.status = st; salvar(); render(); }
function excluirAgenda(id){ if(!confirm('Remover este agendamento?')) return; DB.agenda = agList().filter(a => a.id !== id); salvar(); render(); }
function abrirProntuario(pid){ DB.ativo = pid; PRESC_ID = null; TAB = 'prontuario'; salvar(); render(); }
function mudarSemana(d){ AG_INICIO = dataSomar(AG_INICIO, d * 7); render(); }
function estaSemana(){ AG_INICIO = segundaDe(hoje()); render(); }
function linkLembrete(a, p){
  const digitos = (p.tel || '').replace(/\D/g, '');
  if(digitos.length < 8) return '';
  const fone = digitos.startsWith('55') && digitos.length >= 12 ? digitos : '55' + digitos;
  const txt = `Olá, ${p.nome.split(' ')[0]}! Lembrete da sua consulta de nutrição em ${fmtData(a.data)} às ${a.hora}. Por favor, confirme sua presença. Obrigado!`;
  return `<a class="btn sec mini" target="_blank" rel="noopener" href="https://wa.me/${fone}?text=${encodeURIComponent(txt)}">WhatsApp</a>`;
}
function linhaAg(a){
  const p = pacienteDe(a.pacienteId);

const TIPOS_FOTO = ['Frente','Perfil direito','Perfil esquerdo','Costas','Outra'];

function comprimirImagem(file, maxLado = 800, qualidade = 0.75){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', qualidade));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('um dos arquivos não é uma imagem válida')); };
    img.src = url;
  });
}

function prAtual(){ const p = pac(); return (p && (p.presc || []).find(x => x.id === PRESC_ID)) || null; }
function itemDe(rid){ return prAtual().refeicoes.find(r => r.id === rid); }
/* ---------- necessidades energéticas ---------- */
const METODOS = {
  mifflin:    ['Mifflin-St Jeor (1990)', 'Recomendada para a população geral; usa peso, altura, idade e sexo'],
  harris:     ['Harris-Benedict revisada (1984)', 'Usa peso, altura, idade e sexo'],
  harris1919: ['Harris-Benedict original (1919)', 'Equação clássica; pode superestimar em alguns perfis'],
  schofield:  ['OMS/FAO (Schofield, 1985)', 'Por faixa etária e sexo; usa apenas o peso'],
  katch:      ['Katch-McArdle', 'Usa massa magra (obtida pelas 7 dobras)'],
  cunningham: ['Cunningham (1980)', 'Usa massa magra; indicada para pessoas fisicamente ativas'],
  eer:        ['EER · IOM/DRI (2005)', 'Gasto energético total estimado; já inclui a atividade física']
};
const PA_IOM = { M:{sed:1.00,low:1.11,act:1.25,very:1.48}, F:{sed:1.00,low:1.12,act:1.27,very:1.45} };
function paDe(fa){ return ({1.2:'sed', 1.375:'low', 1.55:'act', 1.725:'very', 1.9:'very'})[fa] || 'act'; }
function tmbPor(metodo, d){
  const { peso, alt, idade, hom, mm } = d;
  if(idade == null) return null;
  switch(metodo){
    case 'mifflin': return 10*peso + 6.25*alt - 5*idade + (hom ? 5 : -161);
    case 'harris': return hom ? 88.362 + 13.397*peso + 4.799*alt - 5.677*idade : 447.593 + 9.247*peso + 3.098*alt - 4.330*idade;
    case 'harris1919': return hom ? 66.473 + 13.7516*peso + 5.0033*alt - 6.7550*idade : 655.0955 + 9.5634*peso + 1.8496*alt - 4.6756*idade;
    case 'schofield': {
      const f = idade < 30 ? (hom ? [15.057,692.2] : [14.818,486.6]) : idade < 60 ? (hom ? [11.472,873.1] : [8.126,845.6]) : (hom ? [11.711,587.7] : [9.082,658.5]);
      return f[0]*peso + f[1];
    }
    case 'katch': return mm == null ? null : 370 + 21.6*mm;
    case 'cunningham': return mm == null ? null : 500 + 22*mm;
    default: return null;
  }
}
function eerIOM(d, pa){
  if(d.idade == null) return null;
  const { peso, alt, idade, hom } = d, H = alt / 100, k = hom ? 'M' : 'F';
  return hom ? 662 - 9.53*idade + PA_IOM[k][pa]*(15.91*peso + 539.6*H)
             : 354 - 6.91*idade + PA_IOM[k][pa]*(9.36*peso + 726*H);
}
function dadosEnergia(p){
  const a = ultimaAntro(p); if(!a) return null;
  const c = calcAntro(a, p);
  return { peso:a.peso, alt:a.altura, idade:(c.idade ?? idadeEm(p.nasc, a.data)), hom:p.sexo === 'M', mm:c.mm, antroData:a.data };
}
function metas(pr, p){
  const d = dadosEnergia(p), metodo = pr.metodo || 'mifflin';
  const tmb = d ? tmbPor(metodo, d) : null;
  const get = !d ? null : (metodo === 'eer' ? eerIOM(d, paDe(pr.fa)) : (tmb != null ? tmb * pr.fa : null));
  const vetCalc = get != null ? get + OBJETIVOS[pr.objetivo][1] : null;
  const vet = pr.vetManual || vetCalc;
  const peso = d ? d.peso : null;
  const ptn = peso ? pr.ptnGkg * peso : null;
  const lip = vet ? vet * pr.lipPct / 100 / 9 : null;
  const cho = (vet && ptn != null && lip != null) ? (vet - ptn*4 - lip*9) / 4 : null;
  return { peso, alt: d ? d.alt : null, idade: d ? d.idade : null, tmb, get, vet, ptn, lip, cho, metodo };
}
function usarMetodo(k){ const pr = prAtual(); if(!pr) return; pr.metodo = k; salvar(); render(); }
function rEnergia(){
  const el = document.getElementById('tab-energia'), p = pac();
  if(!p){ el.innerHTML = semPaciente(); return; }
  const d = dadosEnergia(p), pr = prAtual();
  if(!d){ el.innerHTML = '<div class="card"><div class="aviso">Registre peso e altura na aba Antropometria para calcular as necessidades energéticas.</div></div>'; return; }
  const fa = pr ? pr.fa : 1.55, obj = pr ? pr.objetivo : 'manutencao', ajuste = OBJETIVOS[obj][1];
  const emUso = pr ? (pr.metodo || 'mifflin') : null;
  const faNome = (FA_OPCOES.find(x => x[0] === fa) || [0,''])[1];
  const linhas = Object.keys(METODOS).map(k => {
    const tmb = tmbPor(k, d);
    const get = k === 'eer' ? eerIOM(d, paDe(fa)) : (tmb != null ? tmb * fa : null);
    const vet = get != null ? get + ajuste : null;
    const semMM = (k === 'katch' || k === 'cunningham') && d.mm == null;
    let acao = '';

  salvar(); render();
}
function setQtd(rid, i, valor){

}

function blocoTotais(t, m){
  const linhas = [
    ['Energia (kcal)', t.k, m.vet, 0],
    ['Proteína (g)', t.p, m.ptn, 1],
    ['Lipídeos (g)', t.l, m.lip, 1],
    ['Carboidratos (g)', t.c, m.cho, 1],
    ['Fibra alimentar (g)', t.f, null, 1],
    ['Colesterol (mg)', t.col, null, 0],
    ['Cálcio (mg)', t.ca, null, 0],
    ['Magnésio (mg)', t.mg, null, 0]
  ];
  const dist = t.k > 0 ? `Distribuição calórica calculada: PTN ${fmt(t.p*4/t.k*100,0)}% · LIP ${fmt(t.l*9/t.k*100,0)}% · CHO ${fmt(t.c*4/t.k*100,0)}%.` : '';
  return `<div class="card"><h2>Total do dia × metas</h2>
   <div style="overflow-x:auto"><table><thead><tr><th>Nutriente</th><th class="num">Meta</th><th class="num">Prescrito</th><th class="num">% da meta</th><th>Situação</th></tr></thead><tbody>
   ${linhas.map(([nome,real,meta,d]) => {
     const pc = meta ? real / meta * 100 : null;
     const st = pc == null ? null : (pc >= 90 && pc <= 110) ? ['Adequado','ok'] : (pc >= 80 && pc <= 120) ? ['Ajustar','warn'] : ['Fora da meta','bad'];
     return `<tr><td>${nome}</td><td class="num">${meta == null ? '—' : fmt(meta,d)}</td><td class="num">${fmt(real,d)}</td><td class="num">${pc == null ? '—' : fmt(pc,0)+'%'}</td><td>${st ? `<span class="tag ${st[1]}">${st[0]}</span>` : '<span class="muted">sem meta</span>'}</td></tr>`;
   }).join('')}
   </tbody></table></div>
   <p class="muted" style="font-size:12px;margin-top:8px">${dist} Alimentos sem valor na fonte (—) entram como zero. Faixas: 90–110% adequado; 80–120% ajustar.</p></div>`;
}

/* ---------- backup ---------- */
function exportar(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'prescricao-backup-' + hoje() + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importar(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const x = JSON.parse(r.result);
      if(!x || !Array.isArray(x.pacientes)) throw new Error('arquivo sem a lista de pacientes');
      if(!confirm('Substituir os dados atuais pelo conteúdo deste backup?')) return;
      DB = x; DB.extras = DB.extras || []; DB.agenda = DB.agenda || []; DB.ativo = null; PRESC_ID = null;
      salvar(); montarAlimentos(); render();
    } catch(e){ alert('Não foi possível importar: ' + e.message); }
  };
  r.readAsText(f);
}
function apagarTudo(){
  if(!confirm('Apagar TODOS os pacientes e dados deste navegador?')) return;
  if(!confirm('Tem certeza? Não há como recuperar sem um backup.')) return;
  DB = { pacientes:[], extras:[], agenda:[], ativo:null }; PRESC_ID = null; salvar(); montarAlimentos(); render();
}
function rBackup(){
  document.getElementById('tab-backup').innerHTML = `

    </div></div>
  <div class="card"><h2>Resumo</h2>
    <p class="muted">Pacientes: ${DB.pacientes.length} · Alimentos TBCA/personalizados: ${DB.extras.length} · Base TACO: ${TACO.length} alimentos</p>

function montarPlano(p, pr){
  const m = metas(pr, p), t = somar(pr.refeicoes), a = ultimaAntro(p);
  const idade = idadeEm(p.nasc, pr.data);
  const vet = pr.vetManual || m.vet;
  const ult = (p.evol || []).slice().sort((x,y) => x.data < y.data ? 1 : -1).find(e => e.objetivo);
  const resumo = pr.refeicoes.map(r => {
    const s = somar([r]);
    return `<tr><td>${esc(r.hora || '—')}</td><td>${esc(r.nome)}</td><td class="num">${fmt(s.k,0)}</td><td class="num">${fmt(s.p)}</td><td class="num">${fmt(s.l)}</td><td class="num">${fmt(s.c)}</td><td class="num">${fmt(s.f)}</td></tr>`;
  }).join('');
  const boxes = pr.refeicoes.map(r => {
    const s = somar([r]);
    const linhas = r.itens.map(it => {
      const x = MAPA.get(it.key), n = nutrientes(it.key, it.qtd) || {};
      return `<tr><td>${x ? esc(x.nome) : '(alimento removido da base)'}</td><td class="num">${fmt(it.qtd,0)} g</td><td class="num">${fmt(n.k,0)}</td></tr>`;
    }).join('') || '<tr><td colspan="3" class="muted">Sem alimentos nesta refeição</td></tr>';
    return `<div class="refbox">
      <div class="refhead"><span>${esc(r.nome)}</span><span>${r.hora ? esc(r.hora) + ' · ' : ''}${fmt(s.k,0)} kcal</span></div>
      <table><thead><tr><th>Alimento</th><th class="num">Quantidade</th><th class="num">kcal</th></tr></thead><tbody>${linhas}</tbody></table>
      <div class="refmac">PTN ${fmt(s.p)} g · LIP ${fmt(s.l)} g · CHO ${fmt(s.c)} g · Fibra ${fmt(s.f)} g</div>
    </div>`;
  }).join('');
  const dist = t.k > 0 ? `PTN ${fmt(t.p*4/t.k*100,0)}% · LIP ${fmt(t.l*9/t.k*100,0)}% · CHO ${fmt(t.c*4/t.k*100,0)}%` : '—';
  return `
  <h1>${esc(pr.titulo)}</h1>
  <p class="muted" style="margin:0 0 6px">Data do plano: ${fmtData(pr.data)}</p>
  <table class="info">
    <tr><td><b>Paciente:</b> ${esc(p.nome)}</td><td><b>Sexo:</b> ${p.sexo === 'M' ? 'Masculino' : 'Feminino'}</td><td><b>Idade:</b> ${idade ?? '—'} anos</td></tr>
    <tr><td><b>Nascimento:</b> ${fmtData(p.nasc)}</td><td><b>Peso:</b> ${a ? fmt(a.peso) + ' kg' : '—'}</td><td><b>Altura:</b> ${a ? fmt(a.altura,0) + ' cm' : '—'}</td></tr>
    <tr><td colspan="3"><b>Objetivo do tratamento:</b> ${esc(p.objetivo || '—')}</td></tr>
    ${ult ? `<tr><td colspan="3"><b>Objetivo desta consulta (${fmtData(ult.data)}):</b> ${esc(ult.objetivo)}</td></tr>` : ''}
  </table>
  <h3>Metas diárias</h3>
  <table class="info"><tr><td><b>Valor energético:</b> ${fmt(vet,0)} kcal</td><td><b>Proteína:</b> ${fmt(m.ptn,0)} g</td><td><b>Lipídeos:</b> ${fmt(m.lip,0)} g</td><td><b>Carboidratos:</b> ${fmt(m.cho,0)} g</td></tr></table>
  <p class="muted" style="margin:4px 0 0">Cálculo: ${esc(METODOS[pr.metodo || 'mifflin'][0])} · fator de atividade ${fmt(pr.fa,3)} · objetivo: ${esc(OBJETIVOS[pr.objetivo][0])}</p>
  <h3>Resumo por refeição</h3>
  <table class="resumo"><thead><tr><th>Horário</th><th>Refeição</th><th class="num">kcal</th><th class="num">PTN (g)</th><th class="num">LIP (g)</th><th class="num">CHO (g)</th><th class="num">Fibra (g)</th></tr></thead>
    <tbody>${resumo}</tbody>
    <tfoot><tr><th colspan="2">Total do dia</th><th class="num">${fmt(t.k,0)}</th><th class="num">${fmt(t.p)}</th><th class="num">${fmt(t.l)}</th><th class="num">${fmt(t.c)}</th><th class="num">${fmt(t.f)}</th></tr></tfoot>
  </table>
  <p class="muted" style="margin:4px 0 0">Distribuição calórica: ${dist}</p>
  <h3>Plano alimentar detalhado</h3>
  ${boxes}
  ${pr.orientacoes ? `<h3>Orientações</h3><div class="txt">${esc(pr.orientacoes)}</div>` : ''}
  <div class="assin">
    <div>______________________________<br>Nutricionista responsável<br>CRN: ____________</div>
    <div>______________________________<br>Paciente</div>
  </div>
  <p class="muted rodape">Composição dos alimentos: TACO, 4ª edição ampliada e revisada; TBCA para itens ausentes na TACO. Valores calculados pelo sistema; alimentos sem dado na fonte entram como zero. Emitido em ${fmtData(hoje())}.</p>`;
}
function imprimirPlano(){
  const p = pac(), pr = prAtual();
  if(!p || !pr) return;
  document.getElementById('printArea').innerHTML = montarPlano(p, pr);
  const titulo = document.title;
  document.title = `Plano alimentar · ${p.nome} · ${fmtData(pr.data)}`;
  window.addEventListener('afterprint', () => { document.title = titulo; }, { once:true });
  window.print();
}

/* ---------- navegação ---------- */
function renderBarra(){
  const sel = document.getElementById('selPaciente');
  sel.innerHTML = '<option value="">— nenhum paciente —</option>' + DB.pacientes.slice().sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'))
    .map(p => `<option value="${p.id}" ${p.id === DB.ativo ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
  const p = pac();
  document.getElementById('pacInfo').textContent = p ? `${p.sexo === 'M' ? 'Masculino' : 'Feminino'} · ${idadeEm(p.nasc) ?? '—'} anos` : '';
}
function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'tab-' + TAB));
  renderBarra();
  ({inicio:rInicio, pacientes:rPacientes, agenda:rAgenda, antropometria:rAntro, energia:rEnergia, prontuario:rPront, exames:rExames, fotos:rFotos, prescricao:rPresc, alimentos:rAlim, backup:rBackup})[TAB]();
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if(b){ TAB = b.dataset.tab; render(); }
});
document.getElementById('selPaciente').addEventListener('change', e => {
  DB.ativo = e.target.value || null; PRESC_ID = null; salvar(); render();
});
montarAlimentos();
document.getElementById('dl-exames').innerHTML = EXAMES_SUGERIDOS.map(([n]) => `<option value="${n}"></option>`).join('');
iniciarSync();
render();
</script>
</body>
</html>
